repo:
  name: living-context-engine
  version: 2.1.0
  status: release_candidate
  classification: reality_delta_compiler
product:
  user: founders, product and research teams, and operators making decisions under uncertainty
  function: >-
    turn observations into traceable state, detect what changed and why, keep
    contradictions first-class, and rank the next verification actions
  primary_input: >-
    observation packets, or Markdown/text/JSON/YAML sources containing claim,
    unknown, decision, risk, blocker, and relation statements
  primary_output: >-
    current reality model, state transitions with rationale, open contradictions,
    open unknowns, ranked validation actions, task-scoped context packs, and an
    uncertainty metric over time
primitives:
  - ingestion
  - extraction
  - state_graph
  - delta_engine
  - action_router
invariants_enforced:
  - state_not_content
  - provenance_on_every_claim
  - graph_updates_from_reality
  - contradictions_are_first_class
  - task_specific_retrieval
  - uncertainty_produces_action
  - memory_compounds
  - nothing_inferred_enters_unreviewed
  - one_thing_has_one_name
  - every_claim_serves_a_decision
  - the_engine_speaks_first
  - every_integration_is_one_shape
  - adaptation_is_data_not_a_fork
  - the_graph_explains_itself
north_star_metric: uncertainty removed per unit time
integration:
  surfaces:
    - python_cli
    - python_wheel
    - python_api
    - repository_config
    - github_actions
    - mcp_stdio_server
    - connectors
    - staged_write_http_endpoint
    - slack_webhook
    - html_dashboard
    - sqlite
    - markdown
    - json
    - jsonl
    - csv
    - read_only_http
  connectors: [csv, github_issues, slack_export, filedrop]
  profiles: [customer-discovery, product-decisions, security-posture, hiring]
  credentials_required_for_local_use: false
  optional_model_extraction: anthropic sdk via the `llm` extra
  token_required_for_non_loopback_api: true
verified_offline:
  - staged review with per-origin acceptance rates and no state change until accepted
  - entity and attribute identity resolution, proposed rather than applied
  - decision readiness governed by the weakest load-bearing belief
  - decision-scoped uncertainty
  - connector contract, cursors, roll-up, and error isolation
  - MCP handshake, tool and prompt listing, staged proposals, and tool-level errors
  - write endpoint token separation and idempotency
  - digest rendering in markdown, Slack, and HTML
  - profile vocabulary and half-life adaptation
  - deterministic line extraction and packet validation
  - evidence idempotence across repeated ingestion
  - confidence derived from evidence weight, source independence, and age
  - method ceilings bounding what a source kind can establish
  - transition classification with recorded rationale
  - contradiction detection, supersession margin, and resolution
  - task-scoped context assembly
  - action ranking and expected-gain projection
  - uncertainty metric and snapshots
  - project isolation, deletion, and graph self-validation
  - read-only HTTP state, delta, contradiction, unknown, action, metric, and context endpoints
unverified_external:
  - live GitHub and Slack pulls against real accounts
  - a real MCP client session end to end
  - Slack webhook delivery
  - whether the review gate's cost stays below the value it protects at volume
  - extraction quality against a labelled real corpus
  - model-assisted extraction accuracy at scale
  - whether the ranked actions measurably shorten real decisions
  - multi-user access-policy integration and production throughput
