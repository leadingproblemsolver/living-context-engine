[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "living-context-engine"
version = "2.0.0"
description = "Local-first reality delta compiler: turns observations into traceable state, contradictions, and next validation actions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Leading Problem Solver"}]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.69"]

[project.scripts]
lce = "living_context.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
